name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  product-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run build:cli
      - run: npm run test:distribution-demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: phase12-distribution-evidence
          path: .launchgate/phase12-qa
          include-hidden-files: true
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Controlled, credential-free Reference Lab Chromium journeys.
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build --workspace @launchgate/cli
      - run: npm run test --workspace @launchgate/cli
      - run: node --import tsx scripts/launchgate-resource-inventory.ts capture
      # Includes Phase 9 bounded/malicious patches, isolated previews and GitHub contracts.
      - run: npm run test
      - run: node --import tsx scripts/launchgate-resource-inventory.ts check
      # Includes Phase 8 gate/coverage/freshness, impact/regression selection,
      # signed GitHub Checks contracts and eight-domain Reference Lab releases.
      # Includes executable local Reference Lab auth/tenant/role triplets,
      # reproduction, fix replay and regression. No external targets or secrets.
      # Phase 4 suites are included in test; named commands support focused runs.
      # Database suite also covers durable orchestration races and RLS.
      # Includes Phase 9 durable tenant/role/webhook/quota remediation and bad-fix rejection.
      - run: npm run test:database
        # Also exercises Phase 8 release RLS, fenced scheduling, immutable
        # evaluations and provider-contract discovery/publication without secrets.
        # Includes Phase 5 plus Phase 6 synthetic billing journeys, zero spend,
        # transactional duplicate delivery, finding replay and tenant isolation.
        env:
          LAUNCHGATE_REQUIRE_DATABASE: "1"
      - run: node --import tsx scripts/launchgate-resource-inventory.ts check
        if: always()
      - run: npm run build
      # Full advisory assessment is tracked in docs/launchgate/dependency-audit.md.
      # Known highs remain explicit; any critical advisory fails this job.
      - run: npm audit --audit-level=critical
      - run: npm audit --omit=dev --audit-level=high
